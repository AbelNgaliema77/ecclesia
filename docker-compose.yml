services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecclesia
      POSTGRES_USER: ecclesia
      POSTGRES_PASSWORD: ecclesia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecclesia -d ecclesia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
